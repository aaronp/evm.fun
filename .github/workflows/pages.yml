# Builds the EVM playground (evm-benchmarks/packages/web) and publishes it to GitHub Pages
# (https://aaronp.github.io/evm.fun/). evm-benchmarks/.github/workflows/pages.yml is the same job
# for a repo rooted at evm-benchmarks/.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
# The app uses HashRouter and relative asset URLs, so it works under https://<user>.github.io/<repo>/.
name: Playground → GitHub Pages

on:
  push:
    branches: [master]
    paths: ['evm-benchmarks/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm-benchmarks
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Bun 1.3.13 can segfault while tearing down workers (risk R11): it dies by a signal (exit >= 128)
      # before printing a summary. Retry only that, up to 3 runs; a real test failure (exit 1) fails at once.
      - run: |
          for i in 1 2 3; do
            bun test && exit 0
            code=$?
            [ "$code" -lt 128 ] && exit "$code"
            echo "::warning::bun test crashed (exit $code, risk R11); retry $i of 3"
          done
          exit 1
      - run: bun run web:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: evm-benchmarks/packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
